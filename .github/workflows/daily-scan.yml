name: Quét gol.gg mỗi sáng

on:
  schedule:
    # 01:00 UTC = 08:00 giờ Việt Nam (ICT, UTC+7)
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # cho phép bấm "Run workflow" để chạy tay khi cần

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache trang HTML đã tải (tăng tốc, không bắt buộc)
        uses: actions/cache@v4
        with:
          path: cache
          key: golgg-cache-${{ github.run_id }}
          restore-keys: golgg-cache-

      - name: Quét + huấn luyện lại + dựng trang
        run: node run-update.js 8

      - name: Commit dữ liệu mới (nếu có)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/games.json data/series.json data/dataset.json
          if git diff --cached --quiet; then
            echo "Không có trận mới, không commit."
          else
            git commit -m "Tự động cập nhật dữ liệu $(date -u +%Y-%m-%d)"
            git push
          fi
