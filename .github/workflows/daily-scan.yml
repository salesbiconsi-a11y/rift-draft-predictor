name: Daily gol.gg scan

on:
  schedule:
    # 01:00 UTC = 08:00 Vietnam time (ICT, UTC+7)
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache fetched HTML pages
        uses: actions/cache@v4
        with:
          path: cache
          key: golgg-cache-${{ github.run_id }}
          restore-keys: golgg-cache-

      - name: Scan, retrain, rebuild page
        run: node run-update.js 8

      - name: Commit new data (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/games.json data/series.json data/dataset.json
          if git diff --cached --quiet; then
            echo "No new games, nothing to commit."
          else
            git commit -m "Auto data update $(date -u +%Y-%m-%d)"
            git push
          fi
